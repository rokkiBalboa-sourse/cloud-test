# /etc/nginx/sites-available/cloud.sudostudy.dev.conf

# HTTP: перенаправление на HTTPS и проверка Certbot ACME
server {
    listen 80;
    listen [::]:80;
    server_name cloud.sudostudy.dev;

    # Для обновления сертификатов certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Редирект всего остального трафика на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: Проксирование на Node.js контейнер (порт 3000)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cloud.sudostudy.dev;

    # Сертификаты Let's Encrypt (Certbot)
    ssl_certificate /etc/letsencrypt/live/cloud.sudostudy.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.sudostudy.dev/privkey.pem;

    # Безопасные протоколы и шифры
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Заголовки безопасности
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Максимальный размер тела запроса
    client_max_body_size 20M;

    # Логирование
    access_log /var/log/nginx/cloud_test_access.log;
    error_log /var/log/nginx/cloud_test_error.log;

    location / {
        # Проксирование на Docker-контейнер
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Поддержка WebSocket и Keep-Alive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Передача реальных заголовков клиента
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
